<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Center</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b14;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:linear-gradient(#111832,#070a12);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  background:#151d38;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.coins{
  color:#ffd83d;
  background:#252e4d;
  padding:8px 12px;
  border-radius:20px;
}

.banner{
  margin:15px;
  padding:25px 15px;
  text-align:center;
  border-radius:18px;
  background:linear-gradient(135deg,#6d28d9,#db2777);
}

.banner h2{
  margin:5px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.game{
  padding:22px 10px;
  text-align:center;
  border-radius:16px;
  background:#19213b;
  border:1px solid #303a5c;
}

.game .icon{
  font-size:45px;
}

.game button{
  margin-top:10px;
}

button{
  border:0;
  color:#fff;
  font-weight:bold;
  padding:11px 18px;
  border-radius:22px;
  background:linear-gradient(90deg,#f59e0b,#ef4444);
}

.content{
  padding:0 15px 80px;
}

.panel{
  display:none;
  background:#171e34;
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.panel.active{
  display:block;
}

.slots{
  margin:20px 0;
  padding:25px 5px;
  border-radius:15px;
  background:#080c18;
  font-size:48px;
}

.cards{
  margin:20px 0;
  font-size:55px;
}

.result{
  min-height:25px;
  margin-top:15px;
  color:#ffd83d;
}

.history{
  margin-top:20px;
  text-align:left;
  color:#cbd5e1;
  font-size:14px;
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  display:flex;
  justify-content:space-around;
  padding:11px 5px;
  background:#151c33;
  border-top:1px solid #303a5c;
}

nav button{
  background:transparent;
  padding:5px;
  font-size:13px;
}

</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🎮 GAME CENTER</div>
  <div class="coins">💰 <span id="coins">1000</span></div>
</header>

<div class="banner">
  <h2>🔥 KHU GIẢI TRÍ 🔥</h2>
  <p>Chơi vui bằng xu ảo</p>
</div>

<div class="categories">

  <div class="game">
    <div class="icon">🎰</div>
    <h3>QUAY HŨ</h3>
    <button onclick="openGame('slot')">CHƠI</button>
  </div>

  <div class="game">
    <div class="icon">🃏</div>
    <h3>ĐÁNH BÀI</h3>
    <button onclick="openGame('card')">CHƠI</button>
  </div>

  <div class="game">
    <div class="icon">🎯</div>
    <h3>MINI GAME</h3>
    <button onclick="miniGame()">CHƠI</button>
  </div>

  <div class="game">
    <div class="icon">🏆</div>
    <h3>XẾP HẠNG</h3>
    <button onclick="ranking()">XEM</button>
  </div>

</div>

<div class="content">

  <div id="slot" class="panel">

    <h2>🎰 QUAY HŨ</h2>

    <div class="slots" id="slots">
      🍒 ⭐ 🍋
    </div>

    <button onclick="spin()">QUAY</button>

    <div class="result" id="slotResult"></div>

  </div>


  <div id="card" class="panel">

    <h2>🃏 ĐÁNH BÀI</h2>

    <div class="cards" id="cards">
      🂠 🂠
    </div>

    <button onclick="drawCard()">CHIA BÀI</button>

    <div class="result" id="cardResult"></div>

  </div>


  <div id="history" class="panel">

    <h2>📜 LỊCH SỬ</h2>

    <div id="historyText">
      Chưa có lượt chơi.
    </div>

  </div>

</div>

<nav>
  <button onclick="home()">🏠<br>Trang chủ</button>
  <button onclick="openGame('slot')">🎮<br>Trò chơi</button>
  <button onclick="historyPage()">📜<br>Lịch sử</button>
  <button onclick="profile()">👤<br>Tôi</button>
</nav>

</div>


<script>

let coins = 1000;

const symbols = ["🍒","🍋","⭐","💎","7️⃣"];

function updateCoins(){
  document.getElementById("coins").textContent = coins;
}

function hidePanels(){
  document.querySelectorAll(".panel")
    .forEach(p => p.classList.remove("active"));
}

function openGame(game){

  hidePanels();

  document.getElementById(game)
    .classList.add("active");

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function home(){

  hidePanels();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function addHistory(text){

  const box = document.getElementById("historyText");

  if(box.textContent === "Chưa có lượt chơi.")
    box.innerHTML = "";

  box.innerHTML =
    "<p>"+text+"</p>" + box.innerHTML;
}

function spin(){

  if(coins < 20){

    document.getElementById("slotResult").textContent =
      "Không đủ xu ảo.";

    return;
  }

  coins -= 20;

  let a = symbols[Math.floor(Math.random()*symbols.length)];
  let b = symbols[Math.floor(Math.random()*symbols.length)];
  let c = symbols[Math.floor(Math.random()*symbols.length)];

  document.getElementById("slots").textContent =
    a+" "+b+" "+c;

  if(a === b && b === c){

    coins += 300;

    document.getElementById("slotResult").textContent =
      "🎉 JACKPOT! +300 xu ảo";

    addHistory("🎰 Quay hũ: +300 xu");

  }else{

    document.getElementById("slotResult").textContent =
      "😢 Không trúng. -20 xu ảo";

    addHistory("🎰 Quay hũ: -20 xu");

  }

  updateCoins();
}

function drawCard(){

  if(coins < 30){

    document.getElementById("cardResult").textContent =
      "Không đủ xu ảo.";

    return;
  }

  coins -= 30;

  let player =
    Math.floor(Math.random()*13)+1;

  let computer =
    Math.floor(Math.random()*13)+1;

  document.getElementById("cards").textContent =
    "🃏 "+player+"   🃏 "+computer;

  if(player > computer){

    coins += 80;

    document.getElementById("cardResult").textContent =
      "🎉 Bạn thắng! +80 xu ảo";

    addHistory("🃏 Đánh bài: +80 xu");

  }else if(player === computer){

    coins += 30;

    document.getElementById("cardResult").textContent =
      "🤝 Hòa.";

    addHistory("🃏 Đánh bài: Hòa");

  }else{

    document.getElementById("cardResult").textContent =
      "😢 Bạn thua. -30 xu ảo";

    addHistory("🃏 Đánh bài: -30 xu");

  }

  updateCoins();
}

function miniGame(){

  alert("🎯 Mini Game đang được phát triển!");
}

function ranking(){

  alert("🏆 Bảng xếp hạng demo đang được phát triển!");
}

function historyPage(){

  hidePanels();

  document.getElementById("history")
    .classList.add("active");

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function profile(){

  alert("👤 Tài khoản demo\n\n💰 Xu hiện tại: "+coins);
}

updateCoins();

</script>

</body>
</html>
