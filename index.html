<!DOCTYPE html>

<html lang="vi">

<head>

  <meta charset="UTF-8">

  <title>Game Demo</title>

</head>

<body>

  <h1>🎮 Game Demo</h1>

  <p>Số dư: <span id="balance">1000</span> xu</p>

  <button id="play">Chơi</button>

  <p id="result"></p>

  <script>

    let balance = 1000;

    document.getElementById("play").onclick = function () {

      if (Math.random() > 0.5) {

        balance += 100;

        document.getElementById("result").textContent =

          "🎉 Bạn thắng 100 xu!";

      } else {

        balance -= 50;

        document.getElementById("result").textContent =

          "😢 Bạn thua 50 xu!";

      }

      document.getElementById("balance").textContent = balance;

    };

  </script>

</body>

</html>
