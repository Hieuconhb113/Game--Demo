<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Game Hub</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(circle at top,#29145b,#080713 65%);
 color:#fff;font-family:Arial,sans-serif;min-height:100vh
}
.app{max-width:600px;margin:auto;padding:16px}
header{text-align:center;padding:12px}
.logo{font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 15px #b14cff}
.logo span{color:#ffcf40}
.balance{
 background:#151026;border:1px solid #7946d8;border-radius:16px;
 padding:13px 17px;display:flex;justify-content:space-between;
 margin:10px 0 16px
}
.balance b{color:#ffd43b;font-size:20px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav button{
 background:#171127;color:#aaa;border:1px solid #40305e;
 padding:11px 4px;border-radius:13px;font-weight:bold
}
.nav button.active{background:linear-gradient(135deg,#7c3aed,#ec4899);color:white}
.page{display:none;margin-top:14px}
.page.active{display:block}
.card{
 background:linear-gradient(145deg,#21143e,#0d0a18);
 border:1px solid #6d42b7;border-radius:22px;padding:16px;
 box-shadow:0 0 25px #4b1b8225
}
h2{text-align:center;margin:4px 0 15px}
.reels{
 display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
 background:#05040a;padding:10px;border-radius:15px
}
.reel{
 height:68px;background:#171126;border-radius:10px;
 display:grid;place-items:center;font-size:34px
}
.spin{
 width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;
 color:white;font-size:18px;font-weight:bold;
 background:linear-gradient(135deg,#ec4899,#7c3aed);
 box-shadow:0 0 18px #b33cff66
}
.msg{text-align:center;min-height:28px;margin:12px 0;color:#ffd84d}
.fish{
 position:relative;height:310px;overflow:hidden;border-radius:18px;
 background:linear-gradient(#071c3c,#03244a);
 border:1px solid #1585bd
}
.fish span{position:absolute;font-size:38px;cursor:pointer;user-select:none}
.info{text-align:center;color:#aaa;font-size:13px;margin-top:10px}
table{width:100%;border-collapse:collapse}
td{padding:12px;border-bottom:1px solid #29213c}
td:last-child{text-align:right;color:#ffd43b}
.badge{color:#ffd43b}
</style>
</head>
<body>

<div class="app">

<header>
 <div class="logo">⚡ NEON <span>GAME</span></div>
 <div class="info">Cổng game giải trí • XU ẢO</div>
</header>

<div class="balance">
 <span>🪙 Số dư</span>
 <b id="coins">10000</b>
</div>

<nav class="nav">
 <button class="active" onclick="showPage('slot',this)">🎰 Nổ Hũ</button>
 <button onclick="showPage('fish',this)">🐟 Bắn Cá</button>
 <button onclick="showPage('rank',this)">🏆 BXH</button>
</nav>

<section id="slot" class="page active">
 <div class="card">
  <h2>🎰 NEON JACKPOT</h2>

  <div class="reels">
   <div class="reel">🍒</div>
   <div class="reel">🍋</div>
   <div class="reel">💎</div>
   <div class="reel">🔔</div>
   <div class="reel">7️⃣</div>
  </div>

  <div class="msg" id="slotMsg">Sẵn sàng chưa? ✨</div>
  <button class="spin" id="spinBtn" onclick="spin()">QUAY 🎰</button>

  <div class="info">Mỗi lượt: 100 xu ảo</div>
 </div>
</section>

<section id="fish" class="page">
 <div class="card">
  <h2>🐟 NEON FISH</h2>

  <div class="fish" id="fishTank"></div>

  <div class="msg" id="fishMsg">Chạm vào cá để nhận xu!</div>
  <div class="info">Cá nhỏ +50 • Cá lớn +200 xu ảo</div>
 </div>
</section>

<section id="rank" class="page">
 <div class="card">
  <h2>🏆 BẢNG XẾP HẠNG</h2>

  <table>
   <tr><td>🥇 NeonKing</td><td>125,800</td></tr>
   <tr><td>🥈 Galaxy</td><td>98,450</td></tr>
   <tr><td>🥉 Shadow</td><td>76,200</td></tr>
   <tr><td>⭐ Bạn</td><td id="myRank">10,000</td></tr>
  </table>
 </div>
</section>

</div>

<script>
let coins=10000;
const symbols=["🍒","🍋","🔔","💎","7️⃣"];
const reels=[...document.querySelectorAll(".reel")];

function update(){
 document.getElementById("coins").textContent=coins.toLocaleString();
 document.getElementById("myRank").textContent=coins.toLocaleString();
}

function showPage(id,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");

 document.querySelectorAll(".nav button")
 .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

 if(id==="fish") createFish();
}

function spin(){
 if(coins<100){
  document.getElementById("slotMsg").textContent="❌ Không đủ xu!";
  return;
 }

 coins-=100;
 update();

 const btn=document.getElementById("spinBtn");
 btn.disabled=true;

 reels.forEach(r=>{
  r.style.opacity=".5";
 });

 document.getElementById("slotMsg").textContent="🎰 Đang quay...";

 let result=[];

 setTimeout(()=>{
  reels.forEach(r=>{
   const s=symbols[Math.floor(Math.random()*symbols.length)];
   r.textContent=s;
   result.push(s);
   r.style.opacity="1";
  });

  let count={};
  result.forEach(x=>count[x]=(count[x]||0)+1);
  let max=Math.max(...Object.values(count));
  let win=0;

  if(max===5) win=10000;
  else if(max===4) win=4000;
  else if(max===3) win=1500;
  else if(max===2) win=200;

  if(win){
   coins+=win;
   document.getElementById("slotMsg").textContent=
    "🎉 THẮNG +"+win.toLocaleString()+" xu!";
  }else{
   document.getElementById("slotMsg").textContent=
    "😅 Chưa trúng, thử lại!";
  }

  update();
  btn.disabled=false;
 },850);
}

function createFish(){
 const tank=document.getElementById("fishTank");
 tank.innerHTML="";

 for(let i=0;i<9;i++){
  const fish=document.createElement("span");
  const big=Math.random()<.25;

  fish.textContent=big?"🐠":"🐟";
  fish.style.left=Math.random()*85+"%";
  fish.style.top=Math.random()*80+"%";

  fish.onclick=()=>{
   const reward=big?200:50;
   coins+=reward;
   update();

   document.getElementById("fishMsg").textContent=
    "🎉 +"+reward+" xu ảo!";

   fish.remove();
  };

  tank.appendChild(fish);

  animateFish(fish);
 }
}

function animateFish(fish){
 let x=parseFloat(fish.style.left);
 let direction=Math.random()<.5?1:-1;

 setInterval(()=>{
  x+=direction*.35;

  if(x>88||x<2) direction*=-1;

  fish.style.left=x+"%";
 },30);
}

update();
</script>

</body>
</html>
